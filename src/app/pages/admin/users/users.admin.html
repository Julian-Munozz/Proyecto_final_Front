<div class="users-container">
  @for (user of allUsers; track $index) {
    <div class="user-card">
      <div class="user-info">
        <img [src]="'http://localhost:3000' + user.img" alt="user image">
        <p class="username">{{ user.username }}</p>
        <p class="email">{{ user.email }}</p>
      </div>

      <div class="actions">
        <button class="btn-delete" (click)="deleteUsersById(user._id)">Eliminar</button>
      </div>
    </div>
  }
</div>
